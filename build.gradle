plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.143'
    id 'idea'
}

tasks.named('wrapper', Wrapper).configure {
    distributionType = Wrapper.DistributionType.BIN
}

version = mod_version
group = mod_group_id

sourceSets.main.resources {
    srcDir('src/generated/resources')

    exclude("**/*.bbmodel")
    exclude("src/generated/**/.cache")
}

def testModSourceSet = sourceSets.create('testMod') {
    java.setSrcDirs(['src/test-mod/java'])
    resources.setSrcDirs(['src/test-mod/resources'])
}

testModSourceSet.compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
testModSourceSet.runtimeClasspath += sourceSets.main.output + sourceSets.main.runtimeClasspath

repositories {
    maven { url = "https://cursemaven.com" }
    maven { url = "https://jitpack.io" }
    maven { url = "https://maven.sighs.cc/repository/maven-public/" }
    maven { url = "https://maven.theillusivec4.top/" }
    maven { url = "https://maven.latvian.dev/releases" }
    maven { url = "https://maven.blamejared.com/" }
    maven { url = "https://modmaven.dev" }
    maven { url = "https://maven.ftb.dev/releases" }
    maven { url = "https://maven.architectury.dev" }
    maven { url = "https://dl.cloudsmith.io/public/geckolib3/geckolib/maven/" }
}

base {
    archivesName = mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(25)

def testClientGameDirectory = project.findProperty('mxtTestClientGameDirectory') ?: 'run-test-client'
def testClientUsername = project.findProperty('mxtTestClientUsername')
def testServerGameDirectory = project.findProperty('mxtTestServerGameDirectory') ?: 'run-test-server'
def testServerPort = project.findProperty('mxtTestServerPort') ?: '25566'

neoForge {
    version = project.neo_version

    runs {
        client {
            client()
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }
        gameTestServer {
            type = "gameTestServer"
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        testClient {
            client()
            gameDirectory = file(testClientGameDirectory)
            ideName = 'Test Client'
            systemProperty 'fml.debugLoading', 'true'
            if (testClientUsername) {
                programArgument '--username'
                programArgument testClientUsername
            }
        }

        testServer {
            server()
            gameDirectory = file(testServerGameDirectory)
            ideName = 'Test Server'
            programArgument '--nogui'
            programArgument '--port'
            programArgument testServerPort
            systemProperty 'fml.debugLoading', 'true'
        }

        data {
            clientData()
            programArguments.addAll '--mod', project.mod_id, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()
        }

        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'

            logLevel = org.slf4j.event.Level.INFO

            // Every run has `mxt_test` on its mod path (see the mods block below), and the IntelliJ run configurations
            // this plugin generates only run the IDE's own builder, which never copies resources into
            // `build/resources`. Asking for both class sets makes every IDE launch (and every `gradlew run*`) compile
            // and copy first, instead of serving whatever the previous build left behind. The plugin turns these into
            // a "Run Gradle task" step before launching in IntelliJ.
            taskBefore(tasks.named('classes'))
            taskBefore(tasks.named(testModSourceSet.classesTaskName))
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
        "${mod_id}_test" {
            sourceSet(testModSourceSet)
        }
    }
}

// The runs above declare their build prerequisites with `taskBefore`, which ModDevGradle turns into both a dependency
// of the Gradle run task and a before-launch step in the IntelliJ run configuration. Without it an IDE launch reads
// whatever happens to be in `build/resources/**`, so a fresh checkout or a pull serves the previous test pack.
tasks.named('runTestServer').configure {
    standardInput = System.in
}

configurations {
    runtimeClasspath.extendsFrom localRuntime
}

dependencies {
    implementation "curse.maven:jupiter-1072905:8569832"
    implementation "com.sighs:ApricityUI-neoforge-26.1:${apricityui_version}"

    implementation jarJar("net.objecthunter:exp4j:0.4.8")
    implementation jarJar("top.theillusivec4.curios:curios-neoforge:$curios_version")

    implementation jarJar("curse.maven:player-animation-library-1283899:8674772")
    implementation jarJar("curse.maven:bendable-cuboids-1302303:7986578")

    implementation "curse.maven:jade-324717:8651070"
    compileOnly("mezz.jei:jei-${minecraft_version}-neoforge-api:${jei_version}")
    runtimeOnly("mezz.jei:jei-${minecraft_version}-neoforge:${jei_version}")

    compileOnly "dev.latvian.mods:kubejs-neoforge:$kubejs_version"
//    localRuntime "dev.latvian.mods:kubejs-neoforge:$kubejs_version"

    compileOnly "com.geckolib:geckolib-neoforge-${minecraft_version}:${geckolib_version}"
    // Development only: GeckoLib rendering is optional (the compileOnly line above), but without it on the run
    // classpath there is no way to look at a mount that asks for a GeckoLib model.
    localRuntime "com.geckolib:geckolib-neoforge-${minecraft_version}:${geckolib_version}"

    //FTB
    compileOnly "dev.ftb.mods:ftb-library:26.1.2.8"
    compileOnly "dev.ftb.mods:ftb-teams:26.1.2.4"
    compileOnly "dev.ftb.mods:ftb-chunks:26.1.2.8"

//    runtimeOnly "dev.architectury:architectury-neoforge:20.1.14"
//    runtimeOnly "dev.ftb.mods:ftb-library-neoforge:26.1.2.8"
//    runtimeOnly "dev.ftb.mods:ftb-teams-neoforge:26.1.2.4"
//    runtimeOnly "dev.ftb.mods:ftb-chunks-neoforge:26.1.2.8"

    //Tools
    runtimeOnly "curse.maven:where-are-my-translations-1454778:8997277"
}

var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            curios_version         : curios_version,
            apricityui_version     : apricityui_version,
            geckolib_version       : geckolib_version,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from "src/main/templates"
    into "build/generated/sources/modMetadata"
}
sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/repo"
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
