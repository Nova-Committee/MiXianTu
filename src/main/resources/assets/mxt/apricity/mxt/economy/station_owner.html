<!DOCTYPE html>
<html>
<head>
    <meta name="aui-viewport" content="mode=gui">
    <link rel="stylesheet" href="../base.css">
    <link rel="stylesheet" href="station.css">
</head>
<body>
<!-- 交易站（店主视图，176x221）：只有 StationMenu.TRADE_OWNER 用这一页。
     比顾客页多：展示格（菜单 24）、21 格库存（菜单 25..45）、背包起点 140 而不是 84；
     模板格的 y 也从 18 变成 16（StationMenu.addTemplates 里的 templateY）。 -->
<div class="panel" id="panel" style="width:176px;height:221px">
    <div class="t title" id="title" style="left:8px;top:6px"></div>
    <container class="grid" id="costs" primary="true" style="left:7px;top:15px;grid-template-rows:18px 18px 18px;grid-template-columns:4">
        <slot slot-index="0"></slot><slot slot-index="1"></slot><slot slot-index="2"></slot><slot slot-index="3"></slot>
        <slot slot-index="4"></slot><slot slot-index="5"></slot><slot slot-index="6"></slot><slot slot-index="7"></slot>
        <slot slot-index="8"></slot><slot slot-index="9"></slot><slot slot-index="10"></slot><slot slot-index="11"></slot>
    </container>
    <container class="grid" id="rewards" primary="true" style="left:97px;top:15px;grid-template-rows:18px 18px 18px;grid-template-columns:4">
        <slot slot-index="0"></slot><slot slot-index="1"></slot><slot slot-index="2"></slot><slot slot-index="3"></slot>
        <slot slot-index="4"></slot><slot slot-index="5"></slot><slot slot-index="6"></slot><slot slot-index="7"></slot>
        <slot slot-index="8"></slot><slot slot-index="9"></slot><slot slot-index="10"></slot><slot slot-index="11"></slot>
    </container>
    <container class="grid" id="display" primary="true" style="grid-template-columns:1">
        <slot slot-index="0"></slot>
    </container>
    <container class="grid" id="stock" primary="true" style="grid-template-rows:18px 18px 18px;grid-template-columns:7">
        <slot slot-index="0" repeat="21"></slot>
    </container>
    <div class="t label" id="inventory_label" style="left:8px;top:127px"></div>
    <container class="inv inv-owner" id="inventory" primary="true">
        <slot slot-index="9" repeat="27"></slot>
        <slot slot-index="0" repeat="9"></slot>
    </container>
</div>
</body>
</html>
