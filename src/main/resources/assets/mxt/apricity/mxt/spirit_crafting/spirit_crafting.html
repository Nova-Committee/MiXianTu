<!DOCTYPE html>
<html>
<head>
    <meta name="aui-viewport" content="mode=gui">
    <link rel="stylesheet" href="../common/theme.css">
    <link rel="stylesheet" href="spirit_crafting.css">
</head>
<body>
<!-- 灵气工作台：原版工作台 176x166 + 右侧占满空列的灵气面板，坐标与旧屏幕逐像素对齐。
     槽位 slot-index 是"组内下标"：#crafting / #result 按菜单声明顺序，#inventory 是原版背包下标 0..35。
     容器必须带 primary="true"：ApricityUI 只展开可绑定容器，否则 repeat 不生效。

     灵气进度**只声明一行**（#aura_row）：配方要几种灵气，Java 就复制几行（见 SpiritCraftingScreen）。
     行数不能写死在页面里——旧屏幕那 122px 高的面板按 26px 行距只装得下 4 行，写 8 行会漏到面板外面。 -->
<div class="panel" id="panel">
    <div class="t title" id="title" style="left:8px;top:6px"></div>
    <container class="grid" id="crafting" primary="true" style="left:29px;top:16px;grid-template-columns:3;grid-template-rows:18px 18px 18px">
        <slot slot-index="0"></slot><slot slot-index="1"></slot><slot slot-index="2"></slot>
        <slot slot-index="3"></slot><slot slot-index="4"></slot><slot slot-index="5"></slot>
        <slot slot-index="6"></slot><slot slot-index="7"></slot><slot slot-index="8"></slot>
    </container>
    <container class="grid" id="result" primary="true" style="left:123px;top:34px;grid-template-columns:1">
        <slot slot-index="0"></slot>
    </container>
    <div class="t label" id="inventory_label" style="left:8px;top:72px"></div>
    <container class="grid inv" id="inventory" primary="true">
        <slot slot-index="9" repeat="27"></slot>
        <slot slot-index="0" repeat="9"></slot>
    </container>
    <div class="subpanel aura" id="aura_panel">
        <div class="aura-row" id="aura_row">
            <div class="t name"></div>
            <div class="t amount"></div>
            <div class="bar"><div class="fill"></div></div>
        </div>
    </div>
</div>
</body>
</html>
