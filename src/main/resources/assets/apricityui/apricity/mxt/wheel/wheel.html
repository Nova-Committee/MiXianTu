<!DOCTYPE html>
<html>
<head>
    <meta name="aui-viewport" content="mode=gui">
    <link rel="stylesheet" href="../common/theme.css">
    <link rel="stylesheet" href="wheel.css">
</head>
<!-- 轮盘页：12 个扇、中心文字与页码行。节点 id 是 Java 的绑定契约（见 docs/guide/java/wheel.md）：
     #stage #page #ring #sectors #centre #title #note，每个扇 sector-N，扇里 fill-N / content-N / icon-N /
     texture-N / name-N / sheet-N。
     扇的底色画在扇里那层 .fill 上，.sector 自己不写 background-color（见 wheel.css 第 8 条：AUI 会把
     祖先的背景色带进带文字的子盒子，槽位号就会被涂出一块深色方块）。
     扇里两个图标元素：<item> 画物品图标（Java 用 setIngredientStack 推栈），<texture> 画贴图图标
     （Java 写 src），两者由扇上的 icon-item / icon-texture 类二选一，都没有就画 name。
     冷却白幕 sheet-N 是 .content 里的一块白幕，盖在图标位置上（只画名字的扇盖满整个内容盒）；
     Java 只在"还剩几像素"变了时写它的盒子（见 wheel.css），没在冷却就由 .cooling 类藏起来。
     .index 是槽位号（1 在正上方、顺时针，和配置界面与 12 把槽位键的编号一致），纯页面元素、没有 id、
     Java 不碰它：它跟着 .content 的锚点走，压层由 wheel.css 的 z-index 分组决定。
     页面不写 aui-mouse-events：写了 AUI 会吃掉原生点击，左键"点中就放"会失效。 -->
<body>
<div id="stage">
    <div id="page" class="panel"></div>
    <div id="ring">
        <div id="glow"></div>
        <div id="sectors">
            <!-- 扇 0 在正上方，顺时针编号（与 WheelGeometry.sectorStart 一致）。clip-path 与 .content 的
                 left/top 由 Java 按同一份几何写一次，这里只给结构；.fill 是扇自己的底色那层。 -->
            <div class="sector" id="sector-0">
                <div class="fill"></div>
                <div class="content" id="content-0"><div class="index">1</div><item class="icon" id="icon-0" interactive="none"></item><texture class="tex" id="texture-0"><span class="name" id="name-0"></span><div class="sheet" id="sheet-0"></div></div>
            </div>
            <div class="sector" id="sector-1">
                <div class="fill"></div>
                <div class="content" id="content-1"><div class="index">2</div><item class="icon" id="icon-1" interactive="none"></item><texture class="tex" id="texture-1"><span class="name" id="name-1"></span><div class="sheet" id="sheet-1"></div></div>
            </div>
            <div class="sector" id="sector-2">
                <div class="fill"></div>
                <div class="content" id="content-2"><div class="index">3</div><item class="icon" id="icon-2" interactive="none"></item><texture class="tex" id="texture-2"><span class="name" id="name-2"></span><div class="sheet" id="sheet-2"></div></div>
            </div>
            <div class="sector" id="sector-3">
                <div class="fill"></div>
                <div class="content" id="content-3"><div class="index">4</div><item class="icon" id="icon-3" interactive="none"></item><texture class="tex" id="texture-3"><span class="name" id="name-3"></span><div class="sheet" id="sheet-3"></div></div>
            </div>
            <div class="sector" id="sector-4">
                <div class="fill"></div>
                <div class="content" id="content-4"><div class="index">5</div><item class="icon" id="icon-4" interactive="none"></item><texture class="tex" id="texture-4"><span class="name" id="name-4"></span><div class="sheet" id="sheet-4"></div></div>
            </div>
            <div class="sector" id="sector-5">
                <div class="fill"></div>
                <div class="content" id="content-5"><div class="index">6</div><item class="icon" id="icon-5" interactive="none"></item><texture class="tex" id="texture-5"><span class="name" id="name-5"></span><div class="sheet" id="sheet-5"></div></div>
            </div>
            <div class="sector" id="sector-6">
                <div class="fill"></div>
                <div class="content" id="content-6"><div class="index">7</div><item class="icon" id="icon-6" interactive="none"></item><texture class="tex" id="texture-6"><span class="name" id="name-6"></span><div class="sheet" id="sheet-6"></div></div>
            </div>
            <div class="sector" id="sector-7">
                <div class="fill"></div>
                <div class="content" id="content-7"><div class="index">8</div><item class="icon" id="icon-7" interactive="none"></item><texture class="tex" id="texture-7"><span class="name" id="name-7"></span><div class="sheet" id="sheet-7"></div></div>
            </div>
            <div class="sector" id="sector-8">
                <div class="fill"></div>
                <div class="content" id="content-8"><div class="index">9</div><item class="icon" id="icon-8" interactive="none"></item><texture class="tex" id="texture-8"><span class="name" id="name-8"></span><div class="sheet" id="sheet-8"></div></div>
            </div>
            <div class="sector" id="sector-9">
                <div class="fill"></div>
                <div class="content" id="content-9"><div class="index">10</div><item class="icon" id="icon-9" interactive="none"></item><texture class="tex" id="texture-9"><span class="name" id="name-9"></span><div class="sheet" id="sheet-9"></div></div>
            </div>
            <div class="sector" id="sector-10">
                <div class="fill"></div>
                <div class="content" id="content-10"><div class="index">11</div><item class="icon" id="icon-10" interactive="none"></item><texture class="tex" id="texture-10"><span class="name" id="name-10"></span><div class="sheet" id="sheet-10"></div></div>
            </div>
            <div class="sector" id="sector-11">
                <div class="fill"></div>
                <div class="content" id="content-11"><div class="index">12</div><item class="icon" id="icon-11" interactive="none"></item><texture class="tex" id="texture-11"><span class="name" id="name-11"></span><div class="sheet" id="sheet-11"></div></div>
            </div>
        </div>
        <div id="centre" class="panel">
            <div id="title"></div>
            <div id="note"></div>
        </div>
    </div>
</div>
</body>
</html>
