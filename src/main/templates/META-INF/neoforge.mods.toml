license = "${mod_license}"

issueTrackerURL = "https://github.com/Nova-Committee/MiXianTu/issues" #optional

[[mods]] #mandatory

modId = "${mod_id}" #mandatory

version = "${mod_version}" #mandatory

displayName = "${mod_name}" #mandatory

#updateJSONURL="https://change.me.example.invalid/updates.json" #optional

#displayURL="https://change.me.to.your.mods.homepage.example.invalid/" #optional

logoFile="logo.png" #optional

#credits="" #optional

authors = "IAFEnvoy, cnlimiter"

description = '''
A data-driven cultivation framework with server-authoritative runtime for cultivation, aura, abilities and so on.
'''

[[mixins]]
config = "${mod_id}.mixins.json"

#[[accessTransformers]]
#file="META-INF/accesstransformer.cfg"

# The coremods config file path is not configurable and is always loaded from META-INF/coremods.json

[[dependencies.${mod_id}]] #optional
modId = "neoforge" #mandatory
type = "required" #mandatory
versionRange = "[${neo_version},)" #mandatory
ordering = "NONE"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "minecraft"
type = "required"
versionRange = "${minecraft_version_range}"
ordering = "NONE"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "jupiter"
type = "required"
versionRange = "[2.4,)"
ordering = "NONE"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "curios"
type = "required"
versionRange = "[${curios_version},)"
ordering = "NONE"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "ldlib2"
type = "required"
versionRange = "[${ldlib2_version},)"
ordering = "AFTER"
side = "BOTH"

# Optional: only the client can draw a mount from a GeckoLib model, and a pack that asks for one still loads
# (and flies) without the mod installed.
[[dependencies.${mod_id}]]
modId = "geckolib"
type = "optional"
versionRange = "[${geckolib_version},)"
ordering = "AFTER"
side = "CLIENT"

#[features.${mod_id}]
#openGLVersion="[3.2,)"
